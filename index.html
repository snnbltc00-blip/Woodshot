 const per=Math.max(1,Math.floor((TAU/L.n)/(featherSpacing()*1.065))),slots=[];
 for(let j=0;j<per;j++)for(let c=0;c<L.n;c++)slots.push({a:(c+(j+.5)/per)*TAU/L.n,color:L.wedges?L.wedges[c]:c});
 const seeds=new Set();if(L.seeded){const amount=3+i%5,angular=slots.map((o,k)=>({a:o.a,k})).sort((a,b)=>a.a-b.a);for(let j=0;j<amount;j++)seeds.add(angular[(i*7+Math.floor(j*slots.length/amount))%slots.length].k)}
 stuck=slots.filter((_,k)=>seeds.has(k)).map(o=>({...o,preset:true}));
 const available=slots.filter((_,k)=>!seeds.has(k));const desired=L.fill?Math.max(1,Math.floor(TAU/featherSpacing()*L.fill)-stuck.length):L.dense?available.length:L.baseArrows;
 L.a=Math.min(available.length,desired,L.maxArrows,55-stuck.length);
 // Allocate from actual free capacity, then order without isolated colors in grouped rounds.
 const capacity=Array(7).fill(0),counts=Array(7).fill(0);available.forEach(o=>capacity[o.color]++);
 available.slice(0,L.a).forEach(o=>counts[o.color]++);
 if(!L.singletons){
  for(let c=0;c<6;c++)if(counts[c]===1){counts[c]=0;const dest=counts.findIndex((n,k)=>k<6&&n>=2&&n<capacity[k]);if(dest>=0)counts[dest]++;}
  if(L.wild&&L.a>=10){const source=counts.findIndex(n=>n>=4);if(source>=0){counts[source]-=2;counts[6]=2;}}
 }
 let list=[];
 if(L.singletons){
  // Never leave an adjacent equal-color pair, including the end of the queue.
  while(Math.max(...counts)>Math.ceil(counts.reduce((a,b)=>a+b,0)/2)){const c=counts.indexOf(Math.max(...counts));counts[c]--;}
  let previous=-1;while(counts.some(n=>n)){let color=-1;for(let c=0;c<7;c++)if(c!==previous&&counts[c]>0&&(color<0||counts[c]>counts[color]))color=c;if(color<0)throw Error('Invalid alternating queue');list.push({color,used:false});counts[color]--;previous=color;}
 }else for(const color of queueColorOrder(L))for(let j=0;j<counts[color];j++)list.push({color,used:false});
 L.a=list.length;
 arrows=list;
}
function queueColorOrder(L){const order=[];for(let j=0;j<L.n;j++){const sector=(Math.floor(L.n/2)-j+L.n)%L.n,color=L.wedges?L.wedges[sector]:sector;if(!order.includes(color))order.push(color)}if(!order.includes(6))order.push(6);return order}
function start(i=0){lv=i;angle=-Math.PI/2;elapsed=0;flight=null;burst=0;shake=0;createRound(LEVELS[i],i);mode='play';$('menu').hidden=true;$('level-menu').hidden=true;$('dialog').hidden=true;rack();hud();ac()}
function shoot(i=arrows.findIndex(o=>!o.used)){if(mode!=='play'||flight||i<0||i!==arrows.findIndex(o=>!o.used))return;ac();sound('release');const b=$('rack').querySelector('.arrow').getBoundingClientRect(),c=cv.getBoundingClientRect();flight={i,color:arrows[i].color,t:0,x:b.x+b.width/2-c.x,y:b.y-c.y};}
document.addEventListener('pointerdown',e=>{if(e.target.closest('button,.overlay')||mode!=='play')return;e.preventDefault();shoot()});

function featherSvg(color){return '<svg viewBox="0 0 40 62" aria-hidden="true"><path d="M18 4L3 22V53L18 41ZM22 4L37 22V53L22 41Z" fill="'+color+'" stroke="#101d1980"/><path d="M20 4V58" stroke="#d5b47a" stroke-width="3"/><path d="M5 28L16 18M5 36L16 26M5 44L16 34M24 18L35 28M24 26L35 36M24 34L35 44" stroke="#ffffff55"/></svg>'}
function colorChangeBoost(){const next=arrows.filter(o=>!o.used).slice(0,6);if(next.length<4)return 1;let changes=0;for(let i=1;i<next.length;i++)if(next[i].color!==next[i-1].color)changes++;return changes/(next.length-1)>=.6?1.5:1}
function rotationSpeed(L,t){let speed=L.v;if(L.tempo){const p=(t%5)/5;speed*=p<.46?2.65:p<.5?2.65-(p-.46)/.04*2.43:p<.88?.22:.22+(p-.88)/.12*2.43}else if(L.p)speed*=1+.55*Math.sin(t*1.5);return L.n>=12?Math.min(speed,(TAU/L.n)/(.42-.02*(L.chapter||0))/1.5):speed;}
// Use the same feather vertices as the rendered arrows; SAT includes edge contact.
function featherPolygons(a){const len=Math.min(74,r*.65),d=r-3,A=a-Math.PI/2;return [-1,1].map(s=>[[s,len-24],[s*9,len-14],[s*8,len+1],[s,len-6]].map(([x,y])=>({x:Math.cos(a)*d+x*Math.cos(A)-y*Math.sin(A),y:Math.sin(a)*d+x*Math.sin(A)+y*Math.cos(A)})))}
function polygonsTouch(a,b){for(const p of [a,b])for(let i=0;i<p.length;i++){const q=p[i],v=p[(i+1)%p.length],nx=-(v.y-q.y),ny=v.x-q.x;const aa=a.map(z=>z.x*nx+z.y*ny),bb=b.map(z=>z.x*nx+z.y*ny);if(Math.max(...aa)<Math.min(...bb)-1e-7||Math.max(...bb)<Math.min(...aa)-1e-7)return false}return true}
function feathersTouch(a,b){const aa=featherPolygons(a),bb=featherPolygons(b);return aa.some(p=>bb.some(q=>polygonsTouch(p,q)))}
function featherSpacing(){let lo=0,hi=.8;for(let i=0;i<32;i++){const m=(lo+hi)/2;if(feathersTouch(0,m))lo=m;else hi=m}return hi}
function denseCount(n){return n*Math.max(1,Math.floor((TAU/n)/(featherSpacing()*1.065)))}

function impact(){const f=flight;flight=null;const local=((Math.PI/2-angle)%TAU+TAU)%TAU,seg=Math.floor(local/(TAU/LEVELS[lv].n));sound('impact');if(f.color!==6&&(LEVELS[lv].wedges?LEVELS[lv].wedges[seg]:seg)!==f.color){fail('Renk uyuşmadı','Okun kuyruğuyla aynı renkteki dilimi bekle.');return}if(stuck.some(o=>feathersTouch(local,o.a))){fail('Oklar çarpıştı','Hedefin boş bir kenarını yakalamayı dene.');return}arrows[f.i].used=true;stuck.push({a:local,color:f.color});rack();hud();if(arrows.every(o=>o.used)){mode='win';burst=0;sound('win');$('hint').textContent='TAM İSABET · Sıradaki hedef hazırlanıyor…'}}
let dialogAction=()=>{};function dialog(title,msg,label,fn){$('title').textContent=title;$('message').textContent=msg;$('action').textContent=label;dialogAction=fn;$('dialog').hidden=false}
function fail(title,msg){mode='fail';shake=7;sound('fail');dialog(title,msg,'TEKRAR DENE',()=>start(lv))}
function pause(){if(mode==='play'){mode='pause';dialog('MOLA', 'Hazır olduğunda kaldığın yerden devam et.','DEVAM ET',()=>{mode='play';$('dialog').hidden=true})}}
$('action').onclick=()=>dialogAction();$('pause').onclick=pause;$('home').onclick=()=>{mode='menu';flight=null;$('dialog').hidden=true;$('menu').hidden=false;levelButtons()};$('start').onclick=()=>start(0);function toggleSound(){muted=!muted;for(const id of ['sound','menu-sound']){$(id).textContent=muted?'♪̸':'♫';$(id).setAttribute('aria-label',muted?'Sesi aç':'Sesi kapat');$(id).setAttribute('aria-pressed',String(muted))}if(!muted)ac()}
$('sound').onclick=toggleSound;$('menu-sound').onclick=toggleSound;
$('open-levels').onclick=()=>{$('menu').hidden=true;$('level-menu').hidden=false;levelButtons()};
$('back-menu').onclick=()=>{$('level-menu').hidden=true;$('menu').hidden=false};
function levelButtons(){$('levels').replaceChildren();for(let i=0;i<LEVELS.length;i++){let b=document.createElement('button');b.textContent=i+1;b.classList.toggle('active',i===lv);b.onclick=()=>start(i);$('levels').append(b)}}levelButtons();document.addEventListener('visibilitychange',()=>{if(document.hidden)pause()});addEventListener('keydown',e=>{if(e.code==='Escape')pause()});
function update(dt){if(mode==='play'){const L=LEVELS[lv];elapsed+=dt;angle+=dt*rotationSpeed(L,elapsed)*colorChangeBoost();if(flight){flight.t+=dt;if(flight.t>=.065)impact()}if(mode==='play'&&L.t&&elapsed>=L.t)fail('Süre doldu','Doğru anı yakalayarak ritmini bul.');hud()}else if(mode==='win'){burst+=dt;angle+=dt*.3;if(burst>1.7){if(lv<LEVELS.length-1){unlocked=Math.max(unlocked,lv+2);try{localStorage.setItem('woodshot-unlocked',unlocked)}catch{}start(lv+1)}else{mode='complete';dialog('USTA ATIŞÇI','500 seviyeyi tamamladın! Bütün hedeflerde iz bıraktın.','YENİDEN OYNA',()=>start(0))}}}shake*=Math.exp(-dt*20)}
function draw(){ctx.clearRect(0,0,w,h);ctx.save();ctx.translate(Math.sin(performance.now()*.06)*shake,0);ctx.beginPath();ctx.ellipse(cx,cy+r+85,r*.8,13,0,0,TAU);ctx.fillStyle='#0003';ctx.fill();target(ctx,cx,cy,r,angle,LEVELS[lv].n,LEVELS[lv].wedges);stuck.forEach(o=>{const a=o.a+angle,d=r-3+(mode==='win'?burst*burst*330:0);ctx.globalAlpha=mode==='win'?Math.max(0,1-burst/1.5):1;arrow(ctx,cx+Math.cos(a)*d,cy+Math.sin(a)*d,a-Math.PI/2,COLORS[o.color],Math.min(74,r*.65))});ctx.globalAlpha=1;if(flight){const p=Math.min(1,flight.t/.065),e=1-(1-p)**2;arrow(ctx,flight.x+(cx-flight.x)*e,flight.y+(cy+r-3-flight.y)*e,0,COLORS[flight.color],Math.min(74,r*.65))}if(mode==='play'){ctx.beginPath();ctx.moveTo(cx,cy+r+90);ctx.lineTo(cx,cy+r+105);ctx.strokeStyle='#e9cd8b55';ctx.setLineDash([2,4]);ctx.stroke();ctx.setLineDash([])}ctx.restore();}
const ic=$('intro').getContext('2d');function intro(t){ic.clearRect(0,0,460,410);target(ic,230,190,114,0,2);const phase=(t/1000)%4,p=Math.min(1,Math.max(0,(phase-.6)/.45));if(phase>.6){ic.save();ic.translate(230,190);ic.rotate(-Math.PI/3);arrow(ic,0,(1-p)*370,0,COLORS[0],145);ic.restore()}if(phase>1.05&&phase<1.5){ic.beginPath();ic.arc(230,190,20+(phase-1.05)*140,0,TAU);ic.strokeStyle=`rgba(240,208,137,${1-(phase-1.05)/.45})`;ic.stroke()}}
function frame(t){const dt=Math.min(.04,(t-last)/1000||0);last=t;update(dt);draw();if(mode==='menu')intro(t);requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script></html>
